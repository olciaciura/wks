services:
   wks-zgloszenia-fe:
      image: ghcr.io/olciaciura/wks-zgloszenia-fe:latest
      container_name: wks-zgloszenia-fe
      restart: unless-stopped

      networks:
         - traefik

      labels:
         - "traefik.enable=true"
         - "traefik.http.routers.wks-zgloszenia-fe.rule=Host(`zgloszenia-treningi.pl`)"
         - "traefik.http.services.wks-zgloszenia-fe.loadbalancer.server.port=80"
         - "traefik.http.routers.wks-zgloszenia-fe.entrypoints=websecure"
         - "traefik.http.routers.wks-zgloszenia-fe.tls=true"
         - "traefik.http.routers.wks-zgloszenia-fe.tls.certresolver=letsencrypt"

networks:
   traefik:
      external: true
