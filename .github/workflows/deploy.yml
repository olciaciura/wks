name: Build and Deploy WKS ZGLOSZENIA FE
on:
   # workflow_dispatch:
   push:
      branches: [main]
   workflow_dispatch:

jobs:
   build:
      runs-on: ubuntu-latest
      outputs:
         image_name: ${{ steps.meta.outputs.image_name }}
         image_latest: ${{ steps.meta.outputs.image_latest }}

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Node
           uses: actions/setup-node@v4
           with:
              node-version: 26

         - name: Install deps
           run: npm i

         - name: Build React
           run: npm run build

         - name: Prepare image names
           id: meta
           run: |
              OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
              IMAGE_NAME=ghcr.io/${OWNER}/wks-zgloszenia-fe:sha-${GITHUB_SHA}
              IMAGE_LATEST=ghcr.io/${OWNER}/wks-zgloszenia-fe:latest

              echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
              echo "image_latest=$IMAGE_LATEST" >> $GITHUB_OUTPUT

         - name: Save dist as artifact
           uses: actions/upload-artifact@v4
           with:
              name: wks-zgloszenia-FE-build
              path: dist/

   publish:
      runs-on: ubuntu-latest
      needs: build

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Download build artifact
           uses: actions/download-artifact@v4
           with:
              name: wks-zgloszenia-FE-build
              path: dist/

         - name: Prepare Docker build context
           run: |
              mkdir docker-context
              cp -r dist docker-context/dist
              cp Dockerfile docker-context/

         - name: Login to GHCR
           run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

         - name: Build Docker image
           run: |
              docker build \
                -t ${{ needs.build.outputs.image_name }} \
                -t ${{ needs.build.outputs.image_latest }} \
                docker-context

         - name: Push image
           run: |
              docker push ${{ needs.build.outputs.image_name }}
              docker push ${{ needs.build.outputs.image_latest }}

   deploy:
      runs-on: ubuntu-latest
      needs: publish

      steps:
         - name: Deploy on VPS
           uses: appleboy/ssh-action@v1.0.3
           with:
              host: ${{ secrets.VPS_HOST }}
              username: ${{ secrets.VPS_USER }}
              key: ${{ secrets.VPS_SSH_KEY }}
              script: |
                 echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u olciaciura --password-stdin
                 cd /docker/wks-zgloszenia-fe
                 docker compose pull
                 docker compose up -d
